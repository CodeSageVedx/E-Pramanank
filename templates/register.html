{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - eKYC Platform</title>
    <!-- Font Imports -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'auth.css' %}">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span>e</span>KYC
        </a>
        <button class="hamburger">☰</button>
        <div class="nav-items">
            <a href="/" class="nav-item">Home</a>
            <a href="about" class="nav-item">About</a>
            <a href="index.html#features" class="nav-item">Features</a>
            <a href="index.html#contact" class="nav-item">Contact</a>
            <a href="/register" class="nav-item register-btn active">Register</a>
        </div>
    </nav>

    <!-- Register Section -->
    <div class="flex-1 flex items-center justify-center py-10">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden flex max-w-4xl w-full glassmorph-signup">
            <!-- Left Section (Photo/Welcome) -->
            <div class="w-1/2 bg-blue-500 p-10 flex flex-col justify-center items-center relative">
                <img alt="Abstract blue background" 
                     class="absolute inset-0 w-full h-full object-cover" 
                     src="{% static 'img/register.jpg' %}">
    
                <div class="relative z-10 text-center">
                    <div class="text-white text-lg mb-2">eKYC PLATFORM</div>
                    
                    <h1 class="text-white text-5xl font-bold mb-4">CREATE ACCOUNT</h1>
                    <p class="text-white text-sm">
                        Secure identity verification made simple
                    </p>
                </div>
            </div>

            <!-- Right Section (Register Form) -->
            <div class="w-1/2 p-10 flex flex-col justify-center">
                <h2 class="text-blue-500 text-2xl font-bold mb-6">Register</h2>
                <form action="/register/" method="POST">

                    {% csrf_token %}
                    <div class="form-group mb-4">
                        <label for="customer_name" class="text-gray-500">Username</label>
                        <input type="text" 
                               class="form-control w-full p-3 border border-gray-300 rounded" 
                               id="customer_name" 
                               name="customer_name" 
                               placeholder="Username"
                               required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="customer_mobile" class="text-gray-500">Mobile</label>
                        <input type="tel" 
                               class="form-control w-full p-3 border border-gray-300 rounded" 
                               id="customer_mobile" 
                               name="customer_mobile" 
                               placeholder="Mobile Number"
                               required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="customer_email" class="text-gray-500">Email</label>
                        <input type="email" 
                               class="form-control w-full p-3 border border-gray-300 rounded" 
                               id="customer_email" 
                               name="customer_email" 
                               placeholder="Email Address"
                               required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="customer_password" class="text-gray-500">Password</label>
                        <input type="password" 
                               class="form-control w-full p-3 border border-gray-300 rounded" 
                               id="customer_password" 
                               name="customer_password" 
                               placeholder="Password"
                               required>
                    </div>
                    <button type="submit" 
                            class="btn btn-primary w-full bg-blue-500 text-white p-3 rounded font-bold">
                        Create Account
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <a href="/login" class="text-blue-500 glassmorph-link">Already have an account? Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
