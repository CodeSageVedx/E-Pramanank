{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - eKYC Platform</title>
    <!-- Font Imports -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'auth.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span>e</span>KYC
        </a>
        <button class="hamburger">☰</button>
        <div class="nav-items">
            <a href="/" class="nav-item">Home</a>
            <a href="about" class="nav-item">About</a>
            <a href="index.html#features" class="nav-item">Features</a>
            <a href="index.html#contact" class="nav-item">Contact</a>
            <a href="/register" class="nav-item register-btn">Register</a>
        </div>
    </nav>

    <!-- Login Section -->
    <div class="flex-1 flex items-center justify-center py-10">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden flex max-w-4xl w-full glassmorph-login">
            <!-- Left Section -->
            <div class="w-1/2 bg-blue-500 p-10 flex flex-col justify-center items-center relative">
                <img alt="Abstract blue background" 
                     class="absolute inset-0 w-full h-full object-cover opacity-50" 
                     src="https://placehold.co/600x800">
                <div class="relative z-10 text-center">
                    <div class="text-white text-lg mb-2">eKYC PLATFORM</div>
                    <h2 class="text-white text-3xl font-bold mb-2">Nice to see you again</h2>
                    <h1 class="text-white text-5xl font-bold mb-4">WELCOME BACK</h1>
                    <p class="text-white text-sm">
                        Secure identity verification made simple
                    </p>
                </div>
            </div>

            <!-- Right Section (Login Form) -->
            <div class="w-1/2 p-10 flex flex-col justify-center">
                <h2 class="text-blue-500 text-2xl font-bold mb-6">Login</h2>
<form action="/login/" method="POST">

                    {% csrf_token %}
                    <div class="input-field mb-4">
                        <label for="customer_mobile" class="text-gray-500">Mobile</label>
                        <input type="tel" 
                               class="form-control w-full p-3 border border-gray-300 rounded" 
                               id="customer_mobile" 
                               name="customer_mobile" 
                               placeholder="Mobile Number"
                               required>
                    </div>
                    <div class="input-field mb-4">
                        <label for="customer_password" class="text-gray-500">Password</label>
                        <input type="password" 
                               class="form-control w-full p-3 border border-gray-300 rounded" 
                               id="customer_password" 
                               name="customer_password" 
                               placeholder="Password"
                               required>
                    </div>
                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center text-gray-500">
                            <input class="form-checkbox text-blue-500 mr-2" type="checkbox">
                            Keep me signed in
                        </label>
                        <a href="/register" class="text-blue-500 glassmorph-link">Create an account</a>
                    </div>
                    <button type="submit" 
                            class="glassmorph-btn w-full bg-blue-500 text-white p-3 rounded font-bold">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
